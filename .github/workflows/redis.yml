name: Test, build and push the Redis images

on:
  push:
    branches: [main]
    paths: ['redis/**', 'tests/redis_test.sh', '.github/workflows/redis.yml']
  pull_request:
    paths: ['redis/**', 'tests/redis_test.sh', '.github/workflows/redis.yml']
  workflow_dispatch: {}
  schedule:
    - cron: '0 5 * * 1'   # weekly rebuild: the newest release of every major + Debian security updates

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Entrypoint tests
        run: bash tests/redis_test.sh
      - name: shellcheck
        run: shellcheck --severity=warning redis/entrypoint.sh tests/redis_test.sh
      - name: Dockerfile lint (hadolint)
        run: docker run --rm -i hadolint/hadolint < redis/Dockerfile

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: [6, 7, 8]
    env:
      V: ${{ matrix.redis }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tags
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "IMAGE=ghcr.io/${OWNER}/yolks"
            echo "STAMP=$(date -u +%Y%m%d)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build (local only)
        uses: docker/build-push-action@v6
        with:
          context: redis
          platforms: linux/amd64
          load: true
          tags: local/redis:${{ matrix.redis }}
          build-args: |
            REDIS_MAJOR=${{ matrix.redis }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=redis-${{ matrix.redis }}
          cache-to: type=gha,mode=max,scope=redis-${{ matrix.redis }}

      # Real Redis, started the way Wings starts it: a non-root uid the image does not know, the server folder mounted
      - name: Smoke tests
        run: |
          set -euo pipefail
          IMG="local/redis:${V}"
          START='redis-server --port {{SERVER_PORT}} --bind 0.0.0.0 --protected-mode yes --requirepass {{REDIS_PASSWORD}} --dir /home/container --appendonly {{APPEND_ONLY}} --maxmemory {{MAXMEMORY_MB}}mb --maxmemory-policy {{EVICTION_POLICY}} --daemonize no'
          PW=Passw0rdTest1
          run_redis() {  # $1 = folder, $2 = APPEND_ONLY
            docker run -d --user "$(id -u):$(id -g)" -v "$1:/home/container" -e HOME=/home/container \
              -e SERVER_PORT=3003 -e REDIS_PASSWORD="$PW" -e APPEND_ONLY="$2" -e MAXMEMORY_MB=0 -e EVICTION_POLICY=noeviction \
              -e STARTUP="$START" "$IMG"
          }
          wait_ready() { for _ in $(seq 1 30); do docker logs "$1" 2>&1 | grep -q "Ready to accept connections" && return 0; sleep 1; done; docker logs "$1" 2>&1 | tail -20; return 1; }
          cli() { docker exec "$CID" redis-cli -p 3003 --no-auth-warning "$@"; }
          D="$(mktemp -d)"; chmod 777 "$D"

          echo "--- version"
          docker run --rm --entrypoint redis-server "$IMG" --version | grep -q "v=${V}\."

          echo "--- starts with the egg's startup line and prints the line Pelican waits for"
          CID="$(run_redis "$D" yes)"
          wait_ready "$CID"
          docker logs "$CID" 2>&1 | tail -15

          echo "--- the password is required, the port is the one from the panel"
          if cli ping 2>&1 | grep -q PONG; then echo "answered without a password"; exit 1; fi
          cli -a "$PW" ping | grep -q PONG
          cli -a "$PW" SET persisted yes | grep -q OK

          echo "--- Ctrl+C (SIGINT) stops it and the data is kept"
          docker kill --signal=SIGINT "$CID"
          timeout 30 docker wait "$CID"
          test -n "$(ls "$D"/dump.rdb "$D"/appendonlydir 2>/dev/null)"
          docker rm "$CID" >/dev/null

          echo "--- the data comes back after a restart"
          CID="$(run_redis "$D" yes)"
          wait_ready "$CID"
          cli -a "$PW" GET persisted | grep -q yes
          docker kill "$CID" >/dev/null; docker rm "$CID" >/dev/null

          echo "--- ACL users (what the Redis Databases plugin relies on)"
          D2="$(mktemp -d)"; chmod 777 "$D2"
          CID="$(run_redis "$D2" no)"
          wait_ready "$CID"
          cli -a "$PW" ACL SETUSER u1 reset on '>pw1' '~s1_a:*' '&s1_a:*' +@all -@dangerous -@admin | grep -q OK
          cli --user u1 --pass pw1 SET s1_a:k v | grep -q OK
          cli --user u1 --pass pw1 SET other v 2>&1 | grep -q NOPERM
          cli --user u1 --pass pw1 KEYS '*' 2>&1 | grep -q NOPERM
          cli --user u1 --pass pw1 CONFIG GET maxmemory 2>&1 | grep -q NOPERM
          docker kill "$CID" >/dev/null; docker rm "$CID" >/dev/null

          echo "--- labels"
          docker inspect "$IMG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' | grep -q "${GITHUB_SHA}"
          echo "all smoke tests passed for Redis ${V}"

      - name: Trivy report (CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL --ignore-unfixed --exit-code 0 "local/redis:${V}" || true

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: redis
          platforms: linux/amd64
          push: true
          # :redis_8 is what the egg uses; the dated tag stays so any build can be rolled back to
          tags: |
            ${{ env.IMAGE }}:redis_${{ matrix.redis }}
            ${{ env.IMAGE }}:redis_${{ matrix.redis }}-${{ env.STAMP }}
          build-args: |
            REDIS_MAJOR=${{ matrix.redis }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=redis-${{ matrix.redis }}
