name: Test, build and push the MTA image

on:
  push:
    branches: [main]
    paths: ['mta/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['mta/**', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'   # weekly rebuild: picks up Ubuntu security updates

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tags
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "IMAGE=ghcr.io/${OWNER}/yolks"
            echo "STAMP=$(date -u +%Y%m%d)"
            echo "SHORT_SHA=${GITHUB_SHA::7}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      # 1) The entrypoint tests + shellcheck (no Docker needed)
      - name: Entrypoint tests
        run: bash tests/entrypoint_test.sh

      - name: shellcheck
        run: shellcheck --severity=warning mta/entrypoint.sh

      - name: Dockerfile lint (hadolint)
        run: docker run --rm -i hadolint/hadolint < mta/Dockerfile

      # 2) Build the image locally (not pushed yet)
      - uses: docker/setup-buildx-action@v3

      - name: Build (local only)
        uses: docker/build-push-action@v6
        with:
          context: mta
          platforms: linux/amd64
          load: true
          tags: local/mta:test
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3) Smoke tests against the real image: any failure stops here and nothing is pushed
      - name: Smoke tests
        run: |
          set -euo pipefail
          IMG=local/mta:test

          echo "--- libraries MTA needs"
          docker run --rm --entrypoint sh "$IMG" -c 'ldconfig -p | grep -q "libssl.so.1.1"'
          docker run --rm --entrypoint sh "$IMG" -c 'test -f /usr/lib/libmysqlclient.so.16'
          docker run --rm --entrypoint sh "$IMG" -c 'test -e /usr/lib/x86_64-linux-gnu/libzstd.so'
          docker run --rm --entrypoint sh "$IMG" -c 'ldconfig -p | grep -q "libncursesw.so.5"'

          echo "--- user and folder"
          docker run --rm --entrypoint sh "$IMG" -c 'id container && test -d /home/container && test -x /entrypoint.sh'

          echo "--- tools the entrypoint uses"
          docker run --rm --entrypoint sh "$IMG" -c 'command -v ip && command -v awk && command -v sed && command -v ldd'

          echo "--- entrypoint inside the real image"
          OUT="$(docker run --rm -e STARTUP='echo a-{{FOO}} && echo second' -e FOO=bar "$IMG")"
          echo "$OUT"
          echo "$OUT" | grep -q "Hosted by vndel"
          echo "$OUT" | grep -q "a-bar"
          echo "$OUT" | grep -q "second"

          OUT="$(docker run --rm -e VNDEL_NOTICE= -e STARTUP='echo hi' "$IMG")"
          echo "$OUT" | grep -q "hi"
          if echo "$OUT" | grep -q "NOTE"; then
            echo "the notice was printed although VNDEL_NOTICE is empty"; exit 1
          fi

          echo "--- a missing game binary is reported clearly"
          if docker run --rm -e STARTUP='./mta-server64 --port 1 -n' "$IMG" >/tmp/missing.out 2>&1; then
            echo "expected a failure"; exit 1
          fi
          grep -q "mta-server64 was not found" /tmp/missing.out

          echo "--- image labels"
          docker inspect "$IMG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' | grep -q "${GITHUB_SHA}"

          echo "all smoke tests passed"

      # 4) Vulnerability report (informational: it never blocks the publish)
      - name: Trivy report (CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL --ignore-unfixed --exit-code 0 local/mta:test || true

      # 5) Publish only if everything above passed (never for pull requests)
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: mta
          platforms: linux/amd64
          push: true
          # :mta is what the panel uses; the dated / commit tags stay forever so any build can be rolled back to
          tags: |
            ${{ env.IMAGE }}:mta
            ${{ env.IMAGE }}:mta-${{ env.STAMP }}
            ${{ env.IMAGE }}:mta-${{ env.SHORT_SHA }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
